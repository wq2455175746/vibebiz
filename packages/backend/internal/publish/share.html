<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{.Title}}" />
    <meta property="og:description" content="{{.Description}}" />
    <title>{{.Title}}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f5;
        --surface: #ffffff;
        --ink: #111111;
        --muted: #6b7280;
        --line: #e5e7eb;
        --blue: #2563eb;
        --blue-soft: #eff4ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .page {
        width: min(720px, 100%);
        min-height: 100dvh;
        margin: 0 auto;
        padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      }
      .card {
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 14px 40px rgba(17, 17, 17, 0.08);
      }
      .hero {
        display: flex;
        min-height: 190px;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px;
        background:
          radial-gradient(circle at 85% 15%, rgba(37, 99, 235, 0.24), transparent 36%),
          linear-gradient(135deg, #111111 0%, #374151 55%, #2563eb 140%);
        color: #ffffff;
      }
      .hero small {
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 8vw, 42px);
        line-height: 1.12;
        letter-spacing: -0.03em;
      }
      .body { padding: 22px 24px 24px; }
      .description {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
      .tag {
        padding: 6px 10px;
        background: var(--blue-soft);
        border-radius: 999px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
      }
      .start {
        width: 100%;
        min-height: 50px;
        background: var(--ink);
        border: 0;
        border-radius: 12px;
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .start:active { transform: scale(0.99); }
      .game-shell {
        margin-top: 16px;
        overflow: hidden;
        height: min(58dvh, 560px);
        min-height: 320px;
        background: #111111;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .game-shell iframe { display: block; width: 100%; height: 100%; border: 0; }
      .exit {
        position: fixed;
        z-index: 20;
        top: calc(12px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        display: none;
        padding: 8px 12px;
        background: rgba(17, 17, 17, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        color: #ffffff;
        font: inherit;
        font-size: 12px;
        backdrop-filter: blur(8px);
      }
      body.playing { overflow: hidden; background: #000000; }
      body.playing .page { display: none; }
      body.playing .exit { display: block; }
      body.playing .game-shell {
        position: fixed;
        inset: 0;
        z-index: 10;
        margin: 0;
        height: auto;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
      @media (max-width: 480px) {
        .page { padding-left: 12px; padding-right: 12px; }
        .hero { min-height: 160px; padding: 20px; }
        .body { padding: 18px 20px 20px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="hero">
          <small>互动作品</small>
          <h1>{{.Title}}</h1>
        </header>
        <div class="body">
          <p class="description">{{.Description}}</p>
          <div class="tags">
            {{range .Tags}}<span class="tag">{{.}}</span>{{end}}
          </div>
          <button class="start" id="start" type="button">开始体验</button>
        </div>
      </section>
      <section class="game-shell">
        <iframe
          id="game-frame"
          title="{{.Title}}"
          data-src="{{.GameURL}}"
          allow="fullscreen; autoplay; clipboard-write; gamepad; accelerometer; gyroscope"
          allowfullscreen
        ></iframe>
      </section>
    </main>
    <button class="exit" id="exit" type="button">退出全屏</button>
    <script>
      (function () {
        var frame = document.getElementById('game-frame');
        var start = document.getElementById('start');
        var exit = document.getElementById('exit');
        function play() {
          if (!frame.src) frame.src = frame.dataset.src;
          document.body.classList.add('playing');
        }
        start.addEventListener('click', play);
        exit.addEventListener('click', function () { window.location.reload(); });
        if (new URLSearchParams(window.location.search).get('play') === '1') play();
      })();
    </script>
  </body>
</html>
