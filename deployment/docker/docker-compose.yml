# 本地开发：
#   docker compose -f deployment/docker/docker-compose.yml --env-file /dev/null up -d
# 线上：
#   docker compose -f deployment/docker/docker-compose.public.yml --env-file deployment/docker/.env up -d
name: vibebiz

services:
  logs-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /logs/backend /logs/sandbox /data/skills && chmod 0777 /logs/backend /logs/sandbox /data/skills"]
    volumes:
      - ../../logs:/logs
      - ../../data/skills:/data/skills
    restart: "no"

  publish-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /published && chmod 0777 /published"]
    volumes:
      - ../../data/published:/published
    restart: "no"

  sandbox:
    build:
      context: ../../packages/sandbox
    image: vibebiz/sandbox:local
    env_file:
      - ../../packages/sandbox/.env
    environment:
      WORKSPACES_DIR: /data/workspaces
      SKILLS_ROOT: /data/skills
      SANDBOX_NAME: sandbox
      SANDBOX_ADVERTISE_HOST: sandbox
      SANDBOX_ADVERTISE_PORT: 8000
      CP_REGISTRY_URL: http://backend:8080/cp/api/v1/internal/sandboxes/heartbeat
      SANDBOX_REGISTRY_TOKEN: ${SANDBOX_REGISTRY_TOKEN:-change-me}
      SANDBOX_HEARTBEAT_INTERVAL: ${SANDBOX_HEARTBEAT_INTERVAL:-5s}
      AGENT_MODE: ${AGENT_MODE:-stub}
      AGENT_SANDBOX_ENABLED: ${AGENT_SANDBOX_ENABLED:-true}
      AGENT_NETWORK_RESTRICTED: ${AGENT_NETWORK_RESTRICTED:-false}
      AGENT_SANDBOX_WEAKER_NESTED: ${AGENT_SANDBOX_WEAKER_NESTED:-true}
      AGENT_SANDBOX_ALLOWED_DOMAINS: ${AGENT_SANDBOX_ALLOWED_DOMAINS:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_FETCH_ALLOWED_DOMAINS: ${WEB_FETCH_ALLOWED_DOMAINS:-}
      CLONE_TEST_RUNNER_ENABLED: "false"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-chat}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      OTEL_SERVICE_NAME: vibebiz-sandbox
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=vibebiz}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
    volumes:
      - workspaces:/data/workspaces
      - ../../data/skills:/data/skills
      - ../../logs/sandbox:/app/logs
    depends_on:
      logs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  backend:
    build:
      context: ../../packages/backend
      target: combined
    image: vibebiz/backend:local
    env_file:
      - ../../packages/backend/.env
    environment:
      HOST: 0.0.0.0
      CP_PORT: 8080
      DP_PORT: 8081
      SANDBOX_REGISTRY_TOKEN: ${SANDBOX_REGISTRY_TOKEN:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://vibebiz-dev.com:5173,http://vibebiz-dev-ops.com:5174}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      USER_TRACE_DIR: /app/logs/user-trace
      USAGE_TIMEZONE: ${USAGE_TIMEZONE:-Asia/Shanghai}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=vibebiz}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      WORKSPACES_DIR: /data/workspaces
      PUBLISH_DIR: /data/published
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - ../../logs/backend:/app/logs
      - workspaces:/data/workspaces:ro
      - ../../data/published:/data/published
    depends_on:
      sandbox:
        condition: service_started
      logs-init:
        condition: service_completed_successfully
      publish-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  web:
    build:
      context: ../../packages/web
      args:
        VITE_CP_BASE: ${VITE_CP_BASE:-/cp/api/v1}
        VITE_DP_BASE: ${VITE_DP_BASE:-/dp/api/v1}
        VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-true}
    image: vibebiz/web:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  published:
    image: nginx:1.27-alpine
    container_name: vibebiz-published
    depends_on:
      publish-init:
        condition: service_completed_successfully
    ports:
      - "${PUBLISHED_HTTP_PORT:-8088}:80"
    volumes:
      - ../../data/published:/usr/share/nginx/html:ro
      - ../nginx/published.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  ops-web:
    build:
      context: ../../packages/ops-web
      args:
        VITE_OPS_API_BASE: ${VITE_OPS_API_BASE:-/cp/api/v1/admin}
        VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-true}
    image: vibebiz/ops-web:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"
    restart: unless-stopped

volumes:
  workspaces:
