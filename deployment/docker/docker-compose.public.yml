name: vibebiz

services:
  logs-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /logs/backend /logs/sandbox /data/workspaces && chmod 0777 /logs/backend /logs/sandbox /data/workspaces"]
    volumes:
      - ./logs:/logs
      - ./workspaces:/data/workspaces
    restart: "no"

  publish-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /published && chmod 0777 /published"]
    volumes:
      - ./published:/published
    restart: "no"

  sandbox:
    build:
      context: ../../packages/sandbox
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: vibebiz/sandbox:local
    env_file:
      - .env
    environment:
      HOME: /home/appuser
      CLAUDE_CONFIG_DIR: /data/workspaces/.claude
    volumes:
      - ./workspaces:/data/workspaces
      - ./logs/sandbox:/app/logs
    depends_on:
      logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: ../../packages/backend
      target: combined
    image: vibebiz/backend:local
    env_file:
      - .env
    environment:
      WORKSPACES_DIR: /data/workspaces
      PUBLISH_DIR: /data/published
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - ./logs/backend:/app/logs
      - ./workspaces:/data/workspaces:ro
      - ./published:/data/published
    depends_on:
      sandbox:
        condition: service_started
      logs-init:
        condition: service_completed_successfully
      publish-init:
        condition: service_completed_successfully
    restart: unless-stopped

  published:
    image: nginx:1.27-alpine
    container_name: vibebiz-published
    depends_on:
      publish-init:
        condition: service_completed_successfully
    ports:
      - "${PUBLISHED_HTTP_PORT:-8088}:80"
    volumes:
      - ./published:/usr/share/nginx/html:ro
      - ../nginx/published.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  web:
    build:
      context: ../../packages/web
      args:
        VITE_CP_BASE: ${VITE_CP_BASE:-/cp/api/v1}
        VITE_DP_BASE: ${VITE_DP_BASE:-/dp/api/v1}
        VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-false}
    image: vibebiz/web:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

  ops-web:
    build:
      context: ../../packages/ops-web
      args:
        VITE_OPS_API_BASE: ${VITE_OPS_API_BASE:-/cp/api/v1/admin}
        VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-false}
    image: vibebiz/ops-web:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${OPS_WEB_PORT:-5174}:80"
    restart: unless-stopped
