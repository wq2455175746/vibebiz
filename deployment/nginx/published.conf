# Served by the `published` service in deployment/docker/docker-compose.public.yml.
# Start with:
#   PUBLIC_BASE_URL=http://<server-ip>:<published-port> docker compose up -d backend published
#
# Access: http://<server-ip>:<published-port>/p/<project-id>/
# Host nginx can point root at deployment/docker/published.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /p/ {
        rewrite ^/p/(.*)$ /$1 break;
        index index.html;
        try_files $uri/index.html $uri =404;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location / {
        return 404;
    }
}
