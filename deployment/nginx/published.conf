# Served by the `published` service in docker-compose.yml.
# Start with:
#   PUBLIC_BASE_URL=http://<server-ip>:<published-port> docker compose up -d backend published
#
# Access: http://<server-ip>:<published-port>/p/<project-id>/
# Host nginx can point root directly at <repo>/data/published.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /p/ {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location / {
        return 404;
    }
}
