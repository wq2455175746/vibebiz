replicaCount: 1

image:
  repository: vibebiz/ops-web
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
fullnameOverride: ""
service:
  type: ClusterIP
  port: 80

upstreams:
  cp: backend:8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ops.vibebiz.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
