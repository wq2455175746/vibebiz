replicaCount: 2

image:
  repository: vibebiz/web
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
fullnameOverride: ""
service:
  type: ClusterIP
  port: 80

upstreams:
  cp: backend:8080
  dp: backend-dp:8081

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: vibebiz.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
